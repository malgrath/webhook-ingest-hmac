name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: webhook-ingest-hmac:ci
      - name: Smoke test the container
        run: |
          docker run -d --name smoke -e WEBHOOK_SECRET=ci-secret -p 8000:8000 webhook-ingest-hmac:ci
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:8000/health > /dev/null; then echo "healthy"; exit 0; fi
            sleep 1
          done
          echo "container never became healthy"; docker logs smoke; exit 1
